name: CipherVeil Premium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        cd CipherVeil_Premium
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check syntax
      run: |
        cd CipherVeil_Premium
        python -m py_compile app.py
        python -m py_compile encrypt/aes_gcm.py
        python -m py_compile encrypt/hmac_sha3.py
        python -m py_compile steg/lsb_embed.py
        python -m py_compile steg/lsb_extract.py
    
    - name: Test imports
      run: |
        cd CipherVeil_Premium
        python -c "from encrypt.aes_gcm import aes_gcm_encrypt, aes_gcm_decrypt; print('✓ AES-GCM imported successfully')"
        python -c "from encrypt.hmac_sha3 import generate_hmac_sha3, verify_hmac_sha3; print('✓ HMAC-SHA3 imported successfully')"
        python -c "from steg.lsb_embed import embed_data; print('✓ LSB Embed imported successfully')"
        python -c "from steg.lsb_extract import extract_data; print('✓ LSB Extract imported successfully')"
        python -c "from flask import Flask; print('✓ Flask imported successfully')"
    
    - name: Test Flask app startup
      run: |
        cd CipherVeil_Premium
        timeout 5 python -c "from app import app; print('✓ Flask app initialized successfully')" || true
    
    - name: Test encryption functions
      run: |
        cd CipherVeil_Premium
        python -c "
        from encrypt.aes_gcm import aes_gcm_encrypt, aes_gcm_decrypt
        key = b'1234567890abcdef1234567890abcdef'
        plaintext = 'Hello World'
        ciphertext, nonce, tag = aes_gcm_encrypt(plaintext, key)
        decrypted = aes_gcm_decrypt(ciphertext, key, nonce, tag)
        assert decrypted == plaintext, 'Encryption/Decryption failed'
        print('✓ Encryption/Decryption working correctly')
        "
